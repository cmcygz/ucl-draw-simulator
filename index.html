<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DrawLab · European league phase draw simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4EAEE; --paper-2:#F1F5F7; --paper-3:#D6DFE5;
  --ink:#0C1A26; --ink-2:#41586A; --ink-3:#7E93A2;
  --rule:#B9C7D0;
  --p1:#23256E; --p2:#0B6E6B; --p3:#B26A00; --p4:#8B2A63;
  --p5:#2E6B3A; --p6:#7A2233;
  --mark:#FFE14D;
  --cell:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}

/* ---------- header ---------- */
.eyebrow{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-2); display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.eyebrow b{font-weight:600;color:var(--ink)}
h1{
  font-family:'Big Shoulders Display','Inter Tight',sans-serif;
  font-weight:800; font-size:clamp(46px,9vw,104px); line-height:.86;
  margin:10px 0 0; letter-spacing:-.01em; text-transform:uppercase;
}
h1 span{display:block;color:var(--ink-3)}
h1 span.lead{color:var(--ink)}
.compnote{border:1.5px dashed var(--rule);background:var(--paper-2);padding:18px 20px;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.lede{max-width:52ch;margin:16px 0 0;color:var(--ink-2)}
.rule{height:2px;background:var(--ink);margin:22px 0 0}
.rule.thin{height:1px;background:var(--rule)}

/* ---------- controls ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 0}
button,.seedbox{
  font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px;
  letter-spacing:.06em; text-transform:uppercase;
  background:var(--paper-2); color:var(--ink);
  border:1.5px solid var(--ink); border-radius:0; padding:9px 14px; cursor:pointer;
  transition:background .12s,color .12s,transform .06s;
}
button:hover{background:var(--ink);color:var(--paper-2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:progress}
button.ghost{border-color:var(--rule);color:var(--ink-2)}
button.ghost:hover{border-color:var(--ink);background:var(--ink);color:var(--paper-2)}
.seedbox{display:flex;align-items:center;gap:8px;cursor:default;background:transparent;border-style:dashed}
.seedbox input{
  font:inherit;width:8ch;border:0;background:transparent;color:var(--ink);
  text-align:center;outline:none;border-bottom:1.5px solid var(--ink)
}
select{
  font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px;
  border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:0
}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:0;margin:26px 0 0;border-bottom:2px solid var(--ink);flex-wrap:wrap}
nav.tabs button{
  border:0;border-bottom:4px solid transparent;background:transparent;
  padding:10px 16px 8px;margin-bottom:-2px;color:var(--ink-2)
}
nav.tabs button:hover{background:transparent;color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
section[hidden]{display:none}
section{margin-top:26px}

/* ---------- matrix ---------- */
.matrixScroll{overflow-x:auto;padding-bottom:8px}
table.matrix{border-collapse:collapse;font-family:'IBM Plex Mono',monospace}
table.matrix th.corner{width:150px}
table.matrix th.col{
  height:56px;padding:0 0 6px;vertical-align:bottom;font-weight:500;font-size:10.5px;
  letter-spacing:.08em;color:var(--ink-2)
}
table.matrix th.col div{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto}
table.matrix th.row{
  text-align:right;padding-right:10px;font-weight:500;font-size:11.5px;white-space:nowrap;
  border-right:2px solid var(--ink);cursor:pointer
}
table.matrix th.row em{font-style:normal;color:var(--ink-3);font-size:10px;margin-left:6px}
td.c{
  width:var(--cell);height:var(--cell);border:1px solid var(--paper-3);
  padding:0;position:relative
}
td.c i{display:block;width:100%;height:100%}
td.c.home i{background:currentColor}
td.c.away i{box-shadow:inset 0 0 0 2.5px currentColor}
td.c.self{background:repeating-linear-gradient(45deg,var(--paper-3) 0 2px,transparent 2px 4px)}
td.c.p1,th.p1{color:var(--p1)} td.c.p2,th.p2{color:var(--p2)}
td.c.p3,th.p3{color:var(--p3)} td.c.p4,th.p4{color:var(--p4)}
td.c.p5,th.p5{color:var(--p5)} td.c.p6,th.p6{color:var(--p6)}
td.c.lit{background:var(--mark)}
tr.sel th.row{background:var(--ink);color:var(--paper);border-right-color:var(--ink)}
tr.sel th.row em{color:var(--paper-3)}
.potrail{width:6px;padding:0}
.potrail.p1{background:var(--p1)} .potrail.p2{background:var(--p2)}
.potrail.p3{background:var(--p3)} .potrail.p4{background:var(--p4)}
.potrail.p5{background:var(--p5)} .potrail.p6{background:var(--p6)}

.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
.key{width:14px;height:14px;display:inline-block}
.key.home{background:var(--ink)} .key.away{box-shadow:inset 0 0 0 2.5px var(--ink)}

/* ---------- team detail ---------- */
.detail{margin-top:24px;border-top:2px solid var(--ink);padding-top:16px}
.detail h3{
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;
  font-size:34px;text-transform:uppercase;margin:0;line-height:1
}
.detail .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
ol.fix{list-style:none;margin:14px 0 0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 22px}
ol.fix li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:12.5px}
ol.fix .md{color:var(--ink-3);width:34px;flex:none}
ol.fix .vs{width:16px;flex:none;font-weight:600}
ol.fix .vs.h{color:var(--ink)} ol.fix .vs.a{color:var(--ink-3)}
ol.fix .nm{flex:1;font-family:'Inter Tight',sans-serif;font-size:13.5px}
ol.fix .pt{font-size:10px;color:var(--ink-3)}
.hint{color:var(--ink-3);font-family:'IBM Plex Mono',monospace;font-size:11.5px}

/* ---------- team grid ---------- */
.pothead{display:flex;align-items:baseline;gap:12px;margin:28px 0 10px}
.pothead h2{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;
  text-transform:uppercase;margin:0;letter-spacing:.02em}
.pothead .line{flex:1;height:2px;background:var(--rule)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{
  display:block;width:100%;text-align:left;font:inherit;letter-spacing:normal;
  text-transform:none;color:var(--ink);cursor:pointer;
  background:var(--paper-2);border:1px solid var(--rule);border-left-width:5px;padding:12px 14px;
  transition:background .12s,border-color .12s,transform .06s;
}
.card:hover{
  background:var(--paper-2);color:var(--ink);
  border-top-color:var(--ink);border-right-color:var(--ink);border-bottom-color:var(--ink)
}
.card:hover h4{text-decoration:underline;text-underline-offset:3px}
.card:active{transform:translateY(1px)}
.card.p1{border-left-color:var(--p1)} .card.p2{border-left-color:var(--p2)}
.card.p3{border-left-color:var(--p3)} .card.p4{border-left-color:var(--p4)}
.card.p5{border-left-color:var(--p5)} .card.p6{border-left-color:var(--p6)}

/* ---------- tek takim odagi ---------- */
.focushead{display:flex;align-items:baseline;gap:14px;margin:2px 0 8px}
.focushead h2{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
  font-size:clamp(34px,6vw,52px);text-transform:uppercase;margin:0;line-height:.9}
.focushead .line{flex:1;height:3px;background:var(--ink)}
.focus.p1 .focushead .line{background:var(--p1)} .focus.p2 .focushead .line{background:var(--p2)}
.focus.p3 .focushead .line{background:var(--p3)} .focus.p4 .focushead .line{background:var(--p4)}
.focus.p5 .focushead .line{background:var(--p5)} .focus.p6 .focushead .line{background:var(--p6)}
.focus .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2)}
.fixscroll{overflow-x:auto;margin-top:18px}
table.fixtab{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
table.fixtab th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);padding:0 10px 6px;
  border-bottom:2px solid var(--ink);white-space:nowrap}
table.fixtab td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.fixtab td.md{color:var(--ink-3)}
table.fixtab td.dt{color:var(--ink-3);font-size:11px}
table.fixtab td.nm{font-family:'Inter Tight',sans-serif;font-size:14.5px;font-weight:600;white-space:normal}
table.fixtab td.cn,table.fixtab td.pt{color:var(--ink-3);font-size:11px}
table.fixtab td.vn.p1{color:var(--p1)} table.fixtab td.vn.p2{color:var(--p2)}
table.fixtab td.vn.p3{color:var(--p3)} table.fixtab td.vn.p4{color:var(--p4)}
table.fixtab td.vn.p5{color:var(--p5)} table.fixtab td.vn.p6{color:var(--p6)}
table.fixtab td.vn .key{width:11px;height:11px;vertical-align:-1px}
table.fixtab .key.home{background:currentColor}
table.fixtab .key.away{background:transparent;box-shadow:inset 0 0 0 2.5px currentColor}
table.fixtab td.vn .vt{color:var(--ink-2);font-size:11px;margin-left:8px}
table.fixtab td.sc{font-weight:600}
table.fixtab td.sc.w{color:var(--p2)} table.fixtab td.sc.d{color:var(--ink-2)}
table.fixtab td.sc.l{color:var(--p4)}
table.fixtab td.sc.pick{background:var(--mark)}
.src{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);margin:0 0 12px}
.src b{background:var(--mark);color:var(--ink);font-weight:600;padding:1px 5px}
.card h4{margin:0;font-size:15px;font-weight:650}
.card .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.card ul{list-style:none;margin:0;padding:0}
.card li{display:flex;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:2.5px 0}
.card li .md{color:var(--ink-3);width:28px}
.card li .vs{width:14px;font-weight:600}
.card li .nm{font-family:'Inter Tight',sans-serif;font-size:12.5px}

/* ---------- matchdays ---------- */
.mdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.mdblock h4{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:22px;
  text-transform:uppercase;margin:0 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.mdblock .m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  padding:4px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.mdblock .m .a{text-align:right}
.mdblock .m .s{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);
  background:var(--paper-3);padding:1px 5px;white-space:nowrap;
  display:flex;align-items:center;gap:2px;border:1px solid transparent}
.mdblock .m .s:focus-within{border-color:var(--ink);background:var(--paper-2)}
.mdblock .m .s input{
  width:2ch;padding:0;border:0;background:transparent;text-align:center;outline:none;
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);
  -moz-appearance:textfield
}
.mdblock .m .s input::-webkit-outer-spin-button,
.mdblock .m .s input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mdblock .m .s input::placeholder{color:var(--ink-3);opacity:.7}
.mdblock .m.picked .s{background:var(--mark)}
.mdblock .m.picked .s input{color:var(--ink);font-weight:600}

/* ---------- table ---------- */
table.std{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
table.std th{text-align:right;font-weight:500;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);padding:0 6px 6px;border-bottom:2px solid var(--ink)}
table.std th.l,table.std td.l{text-align:left}
table.std td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:right}
table.std td.nm{font-family:'Inter Tight',sans-serif;font-size:13.5px;text-align:left}
table.std tr.q td{background:rgba(35,37,110,.09)}
table.std tr.po td{background:rgba(178,106,0,.09)}
table.std td.pos{color:var(--ink-3)}
table.std td.pts{font-weight:600}
.bands{display:flex;gap:20px;margin-top:12px;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--ink-2);flex-wrap:wrap}
.swatch{width:12px;height:12px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- probabilities ---------- */
.prob{display:grid;grid-template-columns:150px 1fr 62px;gap:10px;align-items:center;
  padding:3px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.prob .nm{font-family:'Inter Tight',sans-serif;font-size:13px;text-align:right}
.pbar{display:flex;height:15px;background:var(--paper-3)}
.pbar i{display:block;height:100%}
.pbar .q{background:var(--p1)} .pbar .p{background:var(--p3)}
.progress{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}

/* ---------- cekilis toreni ---------- */
.ball{
  width:44px;height:44px;border-radius:50%;flex:none;padding:0;border:0;appearance:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:normal;text-transform:none;color:#fff;
  box-shadow:inset -4px -6px 11px rgba(0,0,0,.28), inset 3px 4px 9px rgba(255,255,255,.32);
  transition:opacity .3s,filter .3s,transform .18s
}
.ball.p1{background:var(--p1)} .ball.p2{background:var(--p2)}
.ball.p3{background:var(--p3)} .ball.p4{background:var(--p4)}
.ball.p5{background:var(--p5)} .ball.p6{background:var(--p6)}
.ball.picked{opacity:.22;filter:grayscale(1);transform:scale(.86)}
button.ball{cursor:pointer}
button.ball:hover{color:#fff}
button.ball:not(.picked):hover{transform:scale(1.16)}
button.ball:not(.picked):active{transform:scale(1.02)}
button.ball.picked{cursor:default;pointer-events:none}
.bowls.locked button.ball{cursor:default;pointer-events:none}
.bowls.locked button.ball:not(.picked){opacity:.82}

.bowls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}
.bowl{border:1.5px solid var(--rule);background:var(--paper-2);padding:12px 14px;
  border-top:5px solid var(--rule);transition:border-color .25s,background .25s}
.bowl.p1{border-top-color:var(--p1)} .bowl.p2{border-top-color:var(--p2)}
.bowl.p3{border-top-color:var(--p3)} .bowl.p4{border-top-color:var(--p4)}
.bowl.p5{border-top-color:var(--p5)} .bowl.p6{border-top-color:var(--p6)}
.bowl.active{background:#fff;border-color:var(--ink)}
.bowl h4{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;
  text-transform:uppercase;margin:0 0 10px}
.bowl .balls{display:flex;flex-wrap:wrap;gap:8px}
.bowl.active .ball:not(.picked){animation:jiggle .5s ease-in-out infinite}
@keyframes jiggle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-8deg)}}

.stage{min-height:132px;margin-top:20px;border-top:2px solid var(--ink);padding-top:18px}
.stage:empty{border-top-color:var(--rule)}
.drawcard{display:flex;align-items:center;gap:20px}
.ball.big{width:88px;height:88px;font-size:17px;
  animation:pop .5s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes pop{
  0%{transform:scale(.25) rotate(-30deg);opacity:0}
  60%{transform:scale(1.14) rotate(5deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.drawcard h3{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
  font-size:clamp(30px,5vw,46px);text-transform:uppercase;margin:0;line-height:.92}
.drawcard .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 22px;margin-top:18px}
.opp{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);
  opacity:0;transform:translateX(-12px);transition:opacity .25s ease,transform .25s ease}
.opp.in{opacity:1;transform:none}
.opp .key{width:12px;height:12px}
.opp.p1{color:var(--p1)} .opp.p2{color:var(--p2)}
.opp.p3{color:var(--p3)} .opp.p4{color:var(--p4)}
.opp.p5{color:var(--p5)} .opp.p6{color:var(--p6)}
.opp .key.home{background:currentColor}
.opp .key.away{background:transparent;box-shadow:inset 0 0 0 2.5px currentColor}
.opp .nm{flex:1;font-size:13.5px;color:var(--ink)}
.opp .vn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}

/* ---------- kayitlar ---------- */
.sharebox{margin:0 0 16px;border:1.5px dashed var(--rule);padding:12px 14px;background:var(--paper-2)}
.sharebox .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.sharebox .row{display:flex;gap:8px;flex-wrap:wrap}
.sharebox input{
  flex:1;min-width:220px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:8px 10px;outline:none
}
.sharebox input:focus{border-color:var(--ink)}
.namebox{
  display:flex;align-items:center;gap:8px;cursor:default;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  background:transparent;border:1.5px dashed var(--rule);padding:9px 14px
}
.namebox input{
  font:inherit;letter-spacing:normal;text-transform:none;width:24ch;
  border:0;background:transparent;color:var(--ink);outline:none;
  border-bottom:1.5px solid var(--ink)
}
.namebox input::placeholder{color:var(--ink-3)}
.hint.bad{color:var(--p4)}
.savelist{display:grid;gap:10px}
.saverow{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  background:var(--paper-2);border:1px solid var(--rule);border-left:5px solid var(--ink-3);padding:11px 14px
}
.saverow.mine{border-left-color:var(--mark)}
.saverow h4{margin:0;font-size:15px;font-weight:650;overflow-wrap:anywhere}
.saverow .meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.saverow .acts{display:flex;gap:8px}
.saverow .acts button{padding:6px 11px;font-size:11px}

footer{margin-top:56px;border-top:1px solid var(--rule);padding-top:16px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);line-height:1.7}

@media (max-width:640px){
  :root{--cell:16px}
  .wrap{padding:20px 14px 56px}
  table.matrix th.corner{width:104px}
  table.matrix th.row{font-size:10px}
  ol.fix{grid-template-columns:1fr}
  .prob{grid-template-columns:104px 1fr 54px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .opp{opacity:1;transform:none}
}
</style>

</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">

<script>
// ---------------------------------------------------------------------------
// Lig asamasi kura motoru (JS portu) - turnuvadan bagimsiz
// ---------------------------------------------------------------------------


// deterministik RNG (mulberry32)
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const shuffle = (arr, rng) => {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

const DEFAULTS = {
  pots: 4,             // torba sayisi   (UCL/UEL 4, UECL 6)
  oppPerPot: 2,        // torba basina rakip (UCL/UEL 2, UECL 1)
  matchdays: 8,        // hafta sayisi   (UCL/UEL 8, UECL 6)
  maxSameCountry: 2,
  allowSameCountry: false,
  bannedHome: [],      // ['liverpool>real', ...]  ev sahibi > deplasman
  nodeBudget: 60000,
};

/** UEFA'nin uc kulup turnuvasinin lig asamasi bicimleri. */
const FORMATS = {
  ucl:  { pots: 4, oppPerPot: 2, matchdays: 8 },
  uel:  { pots: 4, oppPerPot: 2, matchdays: 8 },
  uecl: { pots: 6, oppPerPot: 1, matchdays: 6 }
};

const potList = opt => Array.from({ length: opt.pots }, (_, i) => i + 1);
const matchesPerTeam = opt => opt.pots * opt.oppPerPot;

// --- 1. rakip atamasi -------------------------------------------------------
function drawOpponents(teams, opt, rng) {
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  const ids = teams.map(t => t.id);
  const pots = potList(opt);
  const potMembers = Object.fromEntries(pots.map(p => [p, []]));
  teams.forEach(t => potMembers[t.pot].push(t.id));

  const need = {};
  ids.forEach(i => pots.forEach(p => (need[i + '|' + p] = opt.oppPerPot)));
  const opp = Object.fromEntries(ids.map(i => [i, new Set()]));
  const cc = Object.fromEntries(ids.map(i => [i, {}]));
  const edges = [];
  let budget = opt.nodeBudget;

  const compatible = (a, b) => {
    if (a === b || opp[a].has(b)) return false;
    const ta = byId[a], tb = byId[b];
    if (!opt.allowSameCountry && ta.country === tb.country) return false;
    if (need[b + '|' + ta.pot] <= 0) return false;
    if ((cc[a][tb.country] || 0) >= opt.maxSameCountry) return false;
    if ((cc[b][ta.country] || 0) >= opt.maxSameCountry) return false;
    return true;
  };

  const solve = () => {
    if (--budget <= 0) throw new Error('budget');
    let best = null, bestCands = null;
    for (const id of ids) {
      for (const p of pots) {
        const k = id + '|' + p;
        if (need[k] <= 0) continue;
        const cands = potMembers[p].filter(o => compatible(id, o));
        if (cands.length < need[k]) return false;          // ileri bakis budamasi
        if (!bestCands || cands.length < bestCands.length) {
          best = [id, p]; bestCands = cands;
        }
      }
    }
    if (!best) return true;

    const [team, pot] = best;
    const ta = byId[team];
    for (const other of shuffle(bestCands.slice(), rng)) {
      const tb = byId[other];
      need[team + '|' + pot]--; need[other + '|' + ta.pot]--;
      opp[team].add(other); opp[other].add(team);
      cc[team][tb.country] = (cc[team][tb.country] || 0) + 1;
      cc[other][ta.country] = (cc[other][ta.country] || 0) + 1;
      edges.push([team, other]);

      if (solve()) return true;

      edges.pop();
      cc[team][tb.country]--; cc[other][ta.country]--;
      opp[team].delete(other); opp[other].delete(team);
      need[team + '|' + pot]++; need[other + '|' + ta.pot]++;
    }
    return false;
  };

  try { return solve() ? edges : null; }
  catch (e) { return null; }
}

// --- 2. ic saha / deplasman -------------------------------------------------
/**
 * Yonlendirmeyi bicime gore secer. Torba basina 2 rakip varsa her (potA,potB)
 * blogu ayri dengelenir; 1 rakip varsa blok basina denge imkansizdir, bu yuzden
 * fikstur grafinin tamami dongulere ayrilip toplam ev/deplasman dengelenir.
 */
function orient(edges, teams, opt, rng) {
  return opt.oppPerPot === 1
    ? orientBalanced(edges, teams, opt, rng)
    : orientBlocks(edges, teams, opt, rng);
}

/**
 * Cift dereceli grafi ayrik dongulere ayirir. Her dongu tek yonde dolasilinca
 * her takimin ev sayisi deplasman sayisina esitlenir (UECL'de 3-3).
 */
function cycleDecompose(edges, ids) {
  const adj = new Map(ids.map(i => [i, []]));
  edges.forEach(([a, b], e) => {
    adj.get(a).push({ to: b, e });
    adj.get(b).push({ to: a, e });
  });
  const used = new Array(edges.length).fill(false);
  const free = node => adj.get(node).find(x => !used[x.e]);
  const cycles = [];

  for (const start of ids) {
    for (;;) {
      if (!free(start)) break;
      const cycle = [];
      let cur = start;
      do {
        const step = free(cur);
        if (!step) break;
        used[step.e] = true;
        cycle.push([cur, step.to]);
        cur = step.to;
      } while (cur !== start);
      if (cycle.length) cycles.push(cycle);
    }
  }
  return cycles;
}

function orientBalanced(edges, teams, opt, rng) {
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  const banned = new Set(opt.bannedHome);
  const fixtures = [];

  for (const cycle of cycleDecompose(edges, teams.map(t => t.id))) {
    const fwdBad = cycle.some(([h, a]) => banned.has(h + '>' + a));
    const revBad = cycle.some(([h, a]) => banned.has(a + '>' + h));
    if (fwdBad && revBad) return null;
    const flip = fwdBad || (!revBad && rng() < 0.5);
    for (const [h, a] of cycle) {
      const [home, away] = flip ? [a, h] : [h, a];
      fixtures.push({ home, away, homePot: byId[home].pot, awayPot: byId[away].pot, md: null });
    }
  }
  return fixtures;
}

// Her (potA,potB) blogu 2-regular graf -> dongulere ayrilir. Donguyu tek yonde
// dolasmak her takima tam 1 ic saha + 1 deplasman verir.
function orientBlocks(edges, teams, opt, rng) {
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  const banned = new Set(opt.bannedHome);
  const blocks = new Map();
  for (const [a, b] of edges) {
    const key = [byId[a].pot, byId[b].pot].sort().join('-');
    if (!blocks.has(key)) blocks.set(key, []);
    blocks.get(key).push([a, b]);
  }

  const fixtures = [];
  for (const blockEdges of blocks.values()) {
    const adj = {};
    const unused = new Set();
    for (const [a, b] of blockEdges) {
      (adj[a] = adj[a] || []).push(b);
      (adj[b] = adj[b] || []).push(a);
      unused.add(a < b ? a + '|' + b : b + '|' + a);
    }
    const key = (x, y) => (x < y ? x + '|' + y : y + '|' + x);

    while (unused.size) {
      const start = unused.values().next().value.split('|')[0];
      const cycle = [];
      let cur = start, prev = null;
      for (;;) {
        const next = adj[cur].find(n => n !== prev && unused.has(key(cur, n)));
        if (next === undefined) break;
        unused.delete(key(cur, next));
        cycle.push([cur, next]);
        prev = cur; cur = next;
        if (cur === start) break;
      }
      const fwdBad = cycle.some(([h, a]) => banned.has(h + '>' + a));
      const revBad = cycle.some(([h, a]) => banned.has(a + '>' + h));
      if (fwdBad && revBad) return null;
      const flip = fwdBad || (!revBad && rng() < 0.5);
      for (const [h, a] of cycle) {
        const [home, away] = flip ? [a, h] : [h, a];
        fixtures.push({ home, away, homePot: byId[home].pot, awayPot: byId[away].pot, md: null });
      }
    }
  }
  return fixtures;
}

// --- 3. hafta atamasi -------------------------------------------------------
// Fikstur grafi 8-regular; her hafta = bir mukemmel eslesme (18 mac).
function perfectMatching(adj, ids, rng, budgetRef) {
  const matched = new Set();
  const out = [];
  const rec = () => {
    if (--budgetRef.v <= 0) return false;
    let v = null, cands = null;
    for (const id of ids) {
      if (matched.has(id)) continue;
      const c = adj[id].filter(u => !matched.has(u));
      if (!cands || c.length < cands.length) { v = id; cands = c; }
      if (cands.length === 0) break;
    }
    if (!v) return true;
    if (!cands.length) return false;
    for (const u of shuffle(cands.slice(), rng)) {
      matched.add(v); matched.add(u); out.push([v, u]);
      if (rec()) return true;
      out.pop(); matched.delete(v); matched.delete(u);
    }
    return false;
  };
  return rec() ? out : null;
}

function assignMatchdays(fixtures, ids, rng, { matchdays = 8, avoidThreeInARow = true, tries = 60, altPerRound = 5, budget = 600 } = {}) {
  const key = (x, y) => (x < y ? x + '|' + y : y + '|' + x);
  const pool = new Map(fixtures.map(f => [key(f.home, f.away), f]));

  const buildRound = (left, hist) => {
    const adj = Object.fromEntries(ids.map(i => [i, []]));
    for (const a of ids) {
      for (const b of left.get(a)) {
        if (a >= b) continue;
        const f = pool.get(key(a, b));
        if (avoidThreeInARow) {
          const hh = hist[f.home], aa = hist[f.away];
          if (hh.length >= 2 && hh[hh.length - 1] === 'H' && hh[hh.length - 2] === 'H') continue;
          if (aa.length >= 2 && aa[aa.length - 1] === 'A' && aa[aa.length - 2] === 'A') continue;
        }
        adj[a].push(b); adj[b].push(a);
      }
    }
    return perfectMatching(adj, ids, rng, { v: 200000 });
  };

  for (let attempt = 0; attempt < tries; attempt++) {
    const left = new Map(ids.map(i => [i, new Set()]));
    for (const f of fixtures) { left.get(f.home).add(f.away); left.get(f.away).add(f.home); }
    const hist = Object.fromEntries(ids.map(i => [i, []]));
    const rounds = [];
    let calls = budget;

    // haftalari sirayla kur; bir hafta cikmazsa o haftayi birkac kez farkli
    // eslesmeyle dene, olmazsa bir onceki haftaya geri don (backtracking)
    const rec = (md) => {
      if (md === matchdays) return true;
      for (let k = 0; k < altPerRound; k++) {
        if (--calls <= 0) return false;
        const m = buildRound(left, hist);
        if (!m || m.length !== ids.length / 2) return false;
        for (const [a, b] of m) {
          left.get(a).delete(b); left.get(b).delete(a);
          const f = pool.get(key(a, b));
          hist[f.home].push('H'); hist[f.away].push('A');
        }
        rounds.push(m);
        if (rec(md + 1)) return true;
        rounds.pop();
        for (const [a, b] of m) {
          left.get(a).add(b); left.get(b).add(a);
          const f = pool.get(key(a, b));
          hist[f.home].pop(); hist[f.away].pop();
        }
      }
      return false;
    };

    if (!rec(0)) continue;
    rounds.forEach((m, i) => m.forEach(p => (pool.get(key(p[0], p[1])).md = i + 1)));
    fixtures.sort((x, y) => x.md - y.md || (x.home < y.home ? -1 : 1));
    return true;
  }
  return false;
}

// --- ust seviye -------------------------------------------------------------
function runDraw(teams, seed, options = {}) {
  const opt = { ...DEFAULTS, ...options };
  const rng = makeRng(seed);
  const ids = teams.map(t => t.id);
  for (let restart = 0; restart < 400; restart++) {
    const edges = drawOpponents(teams, opt, rng);
    if (!edges) continue;
    const fixtures = orient(edges, teams, opt, rng);
    if (!fixtures) continue;
    const md = { matchdays: opt.matchdays };
    if (!assignMatchdays(fixtures, ids, rng, md) &&
        !assignMatchdays(fixtures, ids, rng, { ...md, avoidThreeInARow: false })) continue;
    return fixtures;
  }
  return null;
}

function verify(fixtures, teams, opt = DEFAULTS) {
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  const problems = [];
  if (fixtures.length !== teams.length * matchesPerTeam(opt) / 2) problems.push('mac sayisi yanlis');
  const seen = new Set(), hp = {}, ap = {}, oc = {}, mds = {};
  for (const t of teams) { hp[t.id] = {}; ap[t.id] = {}; oc[t.id] = {}; mds[t.id] = new Set(); }
  for (const f of fixtures) {
    const k = [f.home, f.away].sort().join('|');
    if (seen.has(k)) problems.push('tekrar eden eslesme ' + k);
    seen.add(k);
    const h = byId[f.home], a = byId[f.away];
    if (!opt.allowSameCountry && h.country === a.country) problems.push('ayni ulke ' + k);
    hp[h.id][a.pot] = (hp[h.id][a.pot] || 0) + 1;
    ap[a.id][h.pot] = (ap[a.id][h.pot] || 0) + 1;
    oc[h.id][a.country] = (oc[h.id][a.country] || 0) + 1;
    oc[a.id][h.country] = (oc[a.id][h.country] || 0) + 1;
    for (const id of [f.home, f.away]) {
      if (mds[id].has(f.md)) problems.push(id + ' MD' + f.md + ' cift mac');
      mds[id].add(f.md);
    }
  }
  const perPotHome = opt.oppPerPot / 2;
  for (const t of teams) {
    let home = 0, away = 0;
    for (const p of potList(opt)) {
      const h = hp[t.id][p] || 0, a = ap[t.id][p] || 0;
      home += h; away += a;
      if (h + a !== opt.oppPerPot) problems.push(t.id + ' torba' + p + ' rakip sayisi ' + (h + a));
      if (Number.isInteger(perPotHome) && h !== perPotHome) {
        problems.push(t.id + ' torba' + p + ' ic saha ' + h);
      }
    }
    const half = matchesPerTeam(opt) / 2;
    if (home !== half) problems.push(t.id + ' ic saha ' + home + ' != ' + half);
    if (away !== half) problems.push(t.id + ' deplasman ' + away + ' != ' + half);
    for (const [c, n] of Object.entries(oc[t.id]))
      if (n > opt.maxSameCountry) problems.push(t.id + ' ' + c + ' rakip sayisi ' + n);
    if (mds[t.id].size !== opt.matchdays) problems.push(t.id + ' ' + opt.matchdays + ' hafta degil');
  }
  return problems;
}

// --- sonuc simulasyonu ------------------------------------------------------
const BASE_GOALS = 1.45, RATING_SCALE = 0.20, HOME_ADV = 0.22;

function expectedGoals(h, a) {
  const d = (h.rating - a.rating) / 100;
  const clamp = x => Math.min(Math.max(x, 0.15), 6);
  return [clamp(BASE_GOALS * Math.exp(RATING_SCALE * d + HOME_ADV)),
          clamp(BASE_GOALS * Math.exp(-RATING_SCALE * d - HOME_ADV))];
}
function poisson(lam, rng) {
  const L = Math.exp(-lam); let k = 0, p = 1;
  do { k++; p *= rng(); } while (p > L);
  return k - 1;
}
function simulateSeason(fixtures, teams, rng) {
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  return fixtures.map(f => {
    const [lh, la] = expectedGoals(byId[f.home], byId[f.away]);
    return { f, hg: poisson(lh, rng), ag: poisson(la, rng) };
  });
}
function buildTable(results, teams) {
  const rows = Object.fromEntries(teams.map(t => [t.id, {
    id: t.id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, agf: 0, aw: 0, rating: t.rating
  }]));
  for (const r of results) {
    const h = rows[r.f.home], a = rows[r.f.away];
    h.p++; a.p++; h.gf += r.hg; h.ga += r.ag; a.gf += r.ag; a.ga += r.hg; a.agf += r.ag;
    if (r.hg > r.ag) { h.w++; a.l++; }
    else if (r.hg < r.ag) { a.w++; a.aw++; h.l++; }
    else { h.d++; a.d++; }
  }
  const list = Object.values(rows).map(r => ({ ...r, pts: r.w * 3 + r.d, gd: r.gf - r.ga }));
  list.sort((x, y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf ||
                      y.agf - x.agf || y.w - x.w || y.aw - x.aw || y.rating - x.rating);
  return list;
}

// ---------------------------------------------------------------------------
// Turnuvalar: bicim + takim listesi
// ---------------------------------------------------------------------------
// `format` engine.js icindeki FORMATS anahtari.
// `dates` her hafta icin { day, month, year }; ay adi dile gore cevrilir.
// `teams` bos ve `available:false` ise kura henuz cekilmemis demektir.

const UCL_TEAMS = [
  { id:'psg',        name:'Paris',        code:'PAR', country:'FRA', pot:1, rating:1950 },
  { id:'bayern',     name:'Bayern',       code:'BAY', country:'GER', pot:1, rating:1930 },
  { id:'real',       name:'Real Madrid',  code:'RMA', country:'ESP', pot:1, rating:1910 },

const LANG_KEY = 'ucl:lang';
let LANG = 'en';

/** Sozlukten ham degeri verir; dizi gibi metin olmayan girdiler icin. */
function txraw(key) {
  const dict = I18N[LANG] || I18N.en;
  return dict[key] !== undefined ? dict[key] : I18N.en[key];
}

/** Cevrilmis metin; {ad} yer tutucularini vars ile doldurur. */
function tx(key, vars) {
  let out = txraw(key);
  if (typeof out !== 'string') return key;
  if (vars) {
    Object.keys(vars).forEach(k => {
      out = out.split('{' + k + '}').join(String(vars[k]));
    });
  }
  return out;
}

function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) return saved;
  } catch (e) { /* depolama kapalı */ }
  return 'en';
}

/** data-i18n imli tum statik dugumleri gecerli dile cevirir. */
function applyStaticI18n() {
  document.documentElement.lang = tx('html.lang');
  document.title = tx('doc.title');
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = tx(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(n => { n.placeholder = tx(n.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => {
    n.setAttribute('aria-label', tx(n.dataset.i18nAria));
  });
}

let COMP = COMPETITIONS.ucl;
let TEAMS = COMP.teams;
let FORMAT = FORMATS[COMP.format];
let byId = {};
let ORDER = [];                               // torbaya gore siralanmis

/** Aktif turnuvayi degistirir: takim listesi, bicim ve turetilmis indeksler. */
function useCompetition(id) {
  COMP = COMPETITIONS[id] || COMPETITIONS.ucl;
  TEAMS = COMP.teams;
  FORMAT = FORMATS[COMP.format];
  byId = Object.fromEntries(TEAMS.map(t => [t.id, t]));
  ORDER = TEAMS.map(t => t.id);
}

const POTS = () => Array.from({ length: FORMAT.pots }, (_, i) => i + 1);
const drawOpt = () => ({ ...DEFAULTS, ...FORMAT });
const teamCount = () => TEAMS.length || COMP.teamCount || 36;
const matchCount = () => teamCount() * FORMAT.pots * FORMAT.oppPerPot / 2;
const perTeam = () => FORMAT.pots * FORMAT.oppPerPot;

/** Haftanin tarihi; ay adi aktif dilden gelir. */
function compDate(md) {
  const d = COMP.dates && COMP.dates[md - 1];
  if (!d) return '';
  return d.day + ' ' + txraw('months')[d.month - 1] + ' ' + d.year;
}
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};

const state = {
  seed: 2027, fixtures: [], results: null, simIndex: null,
  selected: null, view: {}, picks: {}, dirty: false,
  status: { key: 'status.preparing', vars: {} }
};

const fxKey = f => f.home + '>' + f.away;

/** Baslik satirindaki durumu yazar ve dil degisiminde tekrar cevrilebilsin diye saklar. */
function setStatus(key, vars) {
  state.status = { key: key, vars: vars || {} };
  $('#status').textContent = tx(key, state.status.vars);
}

/**
 * Adres parçasını çözer: `#2027` tohum, `#k=ysjgzzsv` kayıt linki.
 * Tanınmayan biçimde boş nesne döner.
 */
function parseHash() {
  const raw = location.hash.replace(/^#/, '').trim();
  const saved = raw.match(/^k=([A-Za-z0-9]{4,32})$/);
  if (saved) return { saveId: saved[1] };
  const withComp = raw.match(/^(ucl|uel|uecl)(?:-(\d{1,6}))?$/);
  if (withComp) {
    const out = { comp: withComp[1] };
    const n = Number(withComp[2]);
    if (Number.isInteger(n) && n >= 1 && n <= 999999) out.seed = n;
    return out;
  }
  const n = Number(raw);
  if (raw !== '' && Number.isInteger(n) && n >= 1 && n <= 999999) return { seed: n, comp: 'ucl' };
  return {};
}

function writeHash(fragment) {
  try { history.replaceState(null, '', '#' + fragment); } catch (e) { /* file:// kısıtı */ }
}

function showTab(view) {
  const btn = document.querySelector('nav.tabs button[data-view="' + view + '"]');
  if (btn) btn.click();
}

/**
 * Ekranda kaydedilmemis skor var mi? Kura degistirecek her islem once bunu sorar,
 * cunku yeni kura tum skorlari ve tahminleri siler.
 */
function confirmDiscard() {
  if (!state.dirty) return true;
  const n = mergedResults().length;
  return confirm(tx('discard.confirm', { n: n }));
}

/** Bir maçın gösterilecek skoru: kullanıcı tahmini simülasyonu ezer. */
function scoreFor(f) {
  const p = state.picks[fxKey(f)];
  if (p) return { hg: p.hg, ag: p.ag, pick: true };
  const r = state.simIndex && state.simIndex.get(f);
  return r ? { hg: r.hg, ag: r.ag, pick: false } : null;
}

function mergedResults() {
  const out = [];
  for (const f of state.fixtures) {
    const s = scoreFor(f);
    if (s) out.push({ f, hg: s.hg, ag: s.ag });
  }
  return out;
}

function pickCount() {
  const live = new Set(state.fixtures.map(fxKey));
  return Object.keys(state.picks).filter(k => live.has(k)).length;
}

function buildView(fixtures) {
  const v = Object.fromEntries(ORDER.map(id => [id, []]));
  for (const f of fixtures) {
    v[f.home].push({ opp: f.away, venue: 'H', pot: f.awayPot, md: f.md, f });
    v[f.away].push({ opp: f.home, venue: 'A', pot: f.homePot, md: f.md, f });
  }
  for (const id in v) v[id].sort((a, b) => a.md - b.md);
  return v;
}

/**
 * Tohumla kurayi ceker. `apply` verilirse fikstur hazir olduktan sonra, ekranlar
 * cizilmeden once calisir; kayitli skorlari yerlestirmek icin kullanilir.
 */
function newDraw(seed, apply) {
  const btn = $('#redraw');
  btn.disabled = true; btn.textContent = tx('status.drawing');
  setTimeout(() => {
    const f = runDraw(TEAMS, seed, FORMAT);
    btn.disabled = false; btn.textContent = tx('bar.redraw');
    if (!f) { setStatus('status.failed'); return; }
    state.seed = seed; state.fixtures = f; state.results = null; state.simIndex = null;
    state.view = buildView(f);
    state.picks = {};
    state.dirty = false;
    writeHash(COMP.id + '-' + seed);
    if (apply) apply();
    const problems = verify(f, TEAMS, drawOpt());
    if (problems.length) setStatus('status.violation', { msg: problems[0] });
    else setStatus('status.ok', { matches: matchCount() });
    renderAll();
  }, 10);
}

/**
 * Kutudaki tohumla yeniden kura çeker. Tohum değişmemişse bir artırır, çünkü
 * aynı tohum aynı kurayı üretir ve buton etkisiz görünür.
 */
function redrawFromInput() {
  if (!confirmDiscard()) return;
  const typed = Number($('#seed').value) || 1;
  const seed = typed === state.seed ? (typed % 999999) + 1 : typed;
  $('#seed').value = seed;
  newDraw(seed);
}

function switchCompetition(id) {
  if (id === COMP.id) return;
  if (!confirmDiscard()) { $('#comp').value = COMP.id; return; }
  useCompetition(id);
  state.picks = {}; state.results = null; state.simIndex = null;
  state.selected = null; state.dirty = false;
  savesLoaded = false;
  $('#comp').value = COMP.id;
  if (!COMP.available || !TEAMS.length) { renderUnavailable(); writeHash(COMP.id); return; }
  fillTeamPicker();
  newDraw(state.seed);
}

function renderMatrix() {
  const host = $('#matrix'); host.innerHTML = '';
  const map = new Map();
  for (const f of state.fixtures) {
    map.set(f.home + '>' + f.away, { venue: 'H', f });
    map.set(f.away + '>' + f.home, { venue: 'A', f });
  }

  const table = el('table', 'matrix');
  const thead = el('thead'); const hr = el('tr');
  hr.appendChild(el('th', 'corner'));
  hr.appendChild(el('th', 'potrail'));
  ORDER.forEach(id => {
    const th = el('th', 'col p' + byId[id].pot);
    th.appendChild(el('div', null, byId[id].code));
    hr.appendChild(th);
  });
  thead.appendChild(hr); table.appendChild(thead);

  const tbody = el('tbody');
  ORDER.forEach(rowId => {
    const tr = el('tr');
    tr.dataset.team = rowId;
    const th = el('th', 'row');
    th.append(byId[rowId].name);
    const em = el('em', null, byId[rowId].country); th.appendChild(em);
    th.title = tx('matrix.rowTitle', { team: byId[rowId].name });
    tr.appendChild(th);
    tr.appendChild(el('td', 'potrail p' + byId[rowId].pot));

    ORDER.forEach(colId => {
      const td = el('td', 'c');
      if (rowId === colId) { td.classList.add('self'); tr.appendChild(td); return; }
      const hit = map.get(rowId + '>' + colId);
      if (hit) {
        td.classList.add(hit.venue === 'H' ? 'home' : 'away', 'p' + byId[colId].pot);
        td.appendChild(el('i'));
        td.title = hit.venue === 'H'
          ? tx('matrix.cellHome', { md: hit.f.md, home: byId[rowId].name, away: byId[colId].name })
          : tx('matrix.cellAway', { md: hit.f.md, home: byId[colId].name, away: byId[rowId].name });
      }
      td.dataset.row = rowId; td.dataset.col = colId;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  host.appendChild(table);

  table.addEventListener('click', e => {
    const tr = e.target.closest('tr[data-team]');
    if (!tr) return;
    selectTeam(tr.dataset.team);
  });
  paintSelection();
}

function paintSelection() {
  document.querySelectorAll('table.matrix tr').forEach(tr => {
    tr.classList.toggle('sel', tr.dataset.team === state.selected);
  });
  document.querySelectorAll('td.c.lit').forEach(td => td.classList.remove('lit'));
  if (!state.selected) return;
  document.querySelectorAll(`td.c[data-col="${state.selected}"]`)
    .forEach(td => td.classList.add('lit'));
  document.querySelectorAll(`td.c[data-row="${state.selected}"]`)
    .forEach(td => td.classList.add('lit'));
}

function selectTeam(id) {
  state.selected = id;
  paintSelection();
  renderDetail();
  renderTeams();
  $('#teampick').value = id || '';
}

function renderDetail() {
  const host = $('#detail'); host.innerHTML = '';
  if (!state.selected) {
    host.appendChild(el('p', 'hint', tx('detail.hint')));
    return;
  }
  const t = byId[state.selected];
  host.appendChild(el('h3', null, t.name));
  const counts = {};
  state.view[t.id].forEach(r => (counts[byId[r.opp].country] = (counts[byId[r.opp].country] || 0) + 1));
  const doubled = Object.entries(counts).filter(([, n]) => n > 1).map(([c]) => c);
  host.appendChild(el('div', 'meta',
    tx('detail.meta', { country: t.country, pot: t.pot, n: perTeam() / 2 })
    + (doubled.length ? ' · ' + tx('detail.doubled', { list: doubled.join(', ') }) : '')));

  const ol = el('ol', 'fix');
  state.view[t.id].forEach(r => {
    const li = el('li');
    li.appendChild(el('span', 'md', 'MD' + r.md));
    li.appendChild(el('span', 'vs ' + (r.venue === 'H' ? 'h' : 'a'), r.venue === 'H' ? 'vs' : '@'));
    li.appendChild(el('span', 'nm', byId[r.opp].name));
    li.appendChild(el('span', 'pt', 'T' + r.pot));
    ol.appendChild(li);
  });
  host.appendChild(ol);
}

function renderTeams() {

/** Tek takimin sezonluk fikstur paneli; skor sutunu ancak skor varsa cikar. */
function teamFocus(t) {
  const rows = state.view[t.id];
  const scores = new Map(rows.map(r => [r, scoreFor(r.f)]));
  const hasScores = rows.some(r => scores.get(r));

  const box = el('div', 'focus p' + t.pot);
  const head = el('div', 'focushead');
  head.appendChild(el('h2', null, t.name));
  head.appendChild(el('div', 'line'));
  box.appendChild(head);

  const counts = {};
  rows.forEach(r => (counts[byId[r.opp].country] = (counts[byId[r.opp].country] || 0) + 1));
  const doubled = Object.entries(counts).filter(([, n]) => n > 1).map(([c]) => c);
  const bits = [t.country, tx('pot', { n: t.pot }), tx('focus.homeAway', { n: perTeam() / 2 })];
  if (doubled.length) bits.push(tx('detail.doubled', { list: doubled.join(', ') }));
  if (hasScores) {
    let w = 0, d = 0, l = 0, gf = 0, ga = 0, n = 0;
    rows.forEach(r => {
      const res = scores.get(r);
      if (!res) return;
      const f = r.venue === 'H' ? res.hg : res.ag;
      const a = r.venue === 'H' ? res.ag : res.hg;
      gf += f; ga += a; n++;
      if (f > a) w++; else if (f === a) d++; else l++;
    });
    bits.push(tx('focus.record', { n: n, w: w, d: d, l: l, gf: gf, ga: ga, pts: w * 3 + d }));
  }
  box.appendChild(el('div', 'meta', bits.join(' · ')));

  const scroll = el('div', 'fixscroll');
  const table = el('table', 'fixtab');
  const hr = el('tr');
  const cols = ['focus.col.md', 'focus.col.date', 'focus.col.venue',
                'focus.col.opponent', 'focus.col.country', 'focus.col.pot'];
  if (hasScores) cols.push('focus.col.score');
  cols.forEach(c => hr.appendChild(el('th', null, tx(c))));
  table.appendChild(el('thead')).appendChild(hr);

  const tb = el('tbody');
  rows.forEach(r => {
    const opp = byId[r.opp];
    const tr = el('tr');
    tr.appendChild(el('td', 'md', 'MD' + r.md));
    tr.appendChild(el('td', 'dt', compDate(r.md)));

    const vn = el('td', 'vn p' + opp.pot);
    vn.appendChild(el('i', 'key ' + (r.venue === 'H' ? 'home' : 'away')));
    vn.appendChild(el('span', 'vt', tx(r.venue === 'H' ? 'venue.home' : 'venue.away')));
    tr.appendChild(vn);

    tr.appendChild(el('td', 'nm', opp.name));
    tr.appendChild(el('td', 'cn', opp.country));
    tr.appendChild(el('td', 'pt', 'T' + opp.pot));

    if (hasScores) {
      const res = scores.get(r);
      if (!res) { tr.appendChild(el('td', 'sc', '–')); }
      else {
        const f = r.venue === 'H' ? res.hg : res.ag;
        const a = r.venue === 'H' ? res.ag : res.hg;
        const cls = 'sc ' + (f > a ? 'w' : f === a ? 'd' : 'l') + (res.pick ? ' pick' : '');
        const td = el('td', cls, f + '-' + a);
        td.title = tx(res.pick ? 'tip.pick' : 'tip.sim');
        tr.appendChild(td);
      }
    }
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  scroll.appendChild(table);
  box.appendChild(scroll);
  return box;
}

function goalInput(key, side, value, placeholder) {
  const i = document.createElement('input');
  i.type = 'text';
  i.inputMode = 'numeric';
  i.maxLength = 2;
  i.dataset.fx = key;
  i.dataset.side = side;
  i.value = value === null ? '' : String(value);
  i.placeholder = placeholder === null ? '·' : String(placeholder);
  i.setAttribute('aria-label', tx(side === 'h' ? 'md.goalHome' : 'md.goalAway'));
  return i;
}

function renderMatchdays() {
  const host = $('#matchdays'); host.innerHTML = '';
  const grid = el('div', 'mdgrid');
  for (let md = 1; md <= FORMAT.matchdays; md++) {
    const b = el('div', 'mdblock');
    b.appendChild(el('h4', null, tx('md.week', { n: md })));
    b.appendChild(el('div', 'hint', compDate(md)));
    state.fixtures.filter(f => f.md === md).forEach(f => {
      const key = fxKey(f);
      const pick = state.picks[key] || null;
      const sim = (state.simIndex && state.simIndex.get(f)) || null;
      const m = el('div', 'm' + (pick ? ' picked' : ''));
      m.appendChild(el('div', 'a', byId[f.home].name));
      const s = el('div', 's');
      s.appendChild(goalInput(key, 'h', pick ? pick.hg : null, sim ? sim.hg : null));
      s.append('–');
      s.appendChild(goalInput(key, 'a', pick ? pick.ag : null, sim ? sim.ag : null));
      m.appendChild(s);
      m.appendChild(el('div', null, byId[f.away].name));
      b.appendChild(m);
    });
    grid.appendChild(b);

  host.appendChild(grid);
  updatePickCount();
}

function updatePickCount() {

/** Bir skor kutusu degistiginde state'i tazeler; haftalar ekrani yeniden cizilmez. */
function onPickInput(inp) {
  const clean = inp.value.replace(/[^0-9]/g, '').slice(0, 2);
  if (clean !== inp.value) inp.value = clean;
  const row = inp.closest('.m');
  const key = inp.dataset.fx;
  const h = row.querySelector('input[data-side="h"]').value;
  const a = row.querySelector('input[data-side="a"]').value;
  if (h !== '' && a !== '') state.picks[key] = { hg: Number(h), ag: Number(a) };
  else delete state.picks[key];
  row.classList.toggle('picked', key in state.picks);
  state.dirty = true;
  updatePickCount();
  renderTable();
  renderTeams();
}

function mdStatus(msg, bad) {
  const p = $('#mdstatus');
  p.textContent = msg;
  p.classList.toggle('bad', !!bad);
}

/**
 * Bos skor kutularini modelin urettigi skorlarla doldurur: rating farki ve
 * ic saha avantaji Poisson gol beklentisine cevrilir, skor oradan cekilir.
 * Elle girilmis skorlara dokunmaz.
 */
function autofillPicks() {
  const before = pickCount();
  const rng = makeRng((Math.random() * 1e9) | 0);
  const sim = simulateSeason(state.fixtures, TEAMS, rng);
  for (const r of sim) {
    const k = fxKey(r.f);
    if (state.picks[k]) continue;
    state.picks[k] = { hg: r.hg, ag: r.ag };
  }
  state.dirty = true;
  renderMatchdays(); renderTable(); renderTeams();
  const added = pickCount() - before;
  mdStatus(!added ? tx('md.allFull')
    : (before ? tx('md.filledKept', { n: added, kept: before }) : tx('md.filled', { n: added })));
}

function clearPicks() {
  if (!pickCount()) return;
  if (!confirm(tx('md.clearConfirm'))) return;
  state.picks = {};
  state.dirty = mergedResults().length > 0;
  renderMatchdays(); renderTable(); renderTeams();
}

function runMonteCarlo() {
  const mode = $('#mcmode').value;
  const total = mode === 'fixed' ? 3000 : 120;
  const btn = $('#mcrun'); btn.disabled = true;
  const out = $('#probs'); out.innerHTML = '';
  const prog = el('div', 'progress', tx('probs.working', { done: 0, total: total })); out.appendChild(prog);

  const acc = Object.fromEntries(ORDER.map(id => [id, { q: 0, p: 0, pts: 0, pos: 0 }]));
  const rng = makeRng((Math.random() * 1e9) | 0);
  let done = 0, fixtures = state.fixtures;

  const chunk = () => {
    const t0 = performance.now();
    while (done < total && performance.now() - t0 < 60) {
      if (mode !== 'fixed') {
        const f = runDraw(TEAMS, (rng() * 1e9) | 0, FORMAT);
        if (f) fixtures = f;
      }
      const rows = buildTable(simulateSeason(fixtures, TEAMS, rng), TEAMS);
      rows.forEach((r, i) => {
        const a = acc[r.id];
        a.pts += r.pts; a.pos += i + 1;
        if (i < 8) a.q++; else if (i < 24) a.p++;
      });
      done++;
    }
    prog.textContent = tx('probs.working', { done: done, total: total });
    if (done < total) return requestAnimationFrame(chunk);
    btn.disabled = false;
    renderProbs(acc, total, mode);
  };
  requestAnimationFrame(chunk);
}

function renderProbs(acc, total, mode) {
  const out = $('#probs'); out.innerHTML = '';
  out.appendChild(el('p', 'hint',
    tx(mode === 'fixed' ? 'probs.hintFixed' : 'probs.hintRedraw', { total: total })));
  const list = ORDER.slice().sort((a, b) => acc[b].q - acc[a].q || acc[b].p - acc[a].p);
  const head = el('div', 'prob');
  head.appendChild(el('div', 'nm', ''));
  head.appendChild(el('div', 'hint', tx('probs.legend')));
  head.appendChild(el('div', 'hint', tx('probs.avg')));
  out.appendChild(head);
  list.forEach(id => {
    const a = acc[id];
    const row = el('div', 'prob');
    row.appendChild(el('div', 'nm', byId[id].name));
    const bar = el('div', 'pbar');
    const q = el('i', 'q'); q.style.width = (100 * a.q / total) + '%';
    const p = el('i', 'p'); p.style.width = (100 * a.p / total) + '%';
    bar.append(q, p);
    bar.title = tx('probs.tooltip', { q: (100 * a.q / total).toFixed(1), p: (100 * a.p / total).toFixed(1) });
    row.appendChild(bar);
    row.appendChild(el('div', '', (a.pts / total).toFixed(1)));
    out.appendChild(row);
  });
}

const ceremony = {
  gen: 0, busy: false, auto: false, paused: false, skip: false,
  speed: 1, pot: 0, drawn: 0, taken: new Set()
};
const CTIME = { spin: 900, reveal: 700, opponent: 420, rest: 600 };

function drawStatus(msg) { $('#drawstatus').textContent = msg; }

/** Duraklatma ve hiza saygi duyan bekleme; kura degisirse false doner. */
function cwait(ms, gen) {
  return new Promise(resolve => {
    let left = ms / (ceremony.speed || 1);
    const step = () => {
      if (ceremony.gen !== gen) return resolve(false);
      if (ceremony.paused) return setTimeout(step, 80);
      if (left <= 0) return resolve(true);
      const slice = Math.min(50, left);
      left -= slice;
      setTimeout(step, slice);
    };
    step();
  });
}

/** Sahnedeki acilmis top: takim kodunu tasir. */
function stageBall(t) {

/** Torbadaki kapali top: hangi takim oldugu belli degildir. */

function renderBowls() {

function remainingInPot(pot) {
  return ORDER.filter(id => byId[id].pot === pot && !ceremony.taken.has(id));
}

function freeBall(pot) {
  return document.querySelector('#drawbowls .bowl[data-pot="' + pot + '"] .ball:not(.picked)');

/** Kapali topu acar: takim kodunu yazar ve sonencesine soluklastirir. */
function openBall(ball, t) {
  if (!ball) return;
  ball.textContent = t.code;
  ball.title = t.name;
  ball.setAttribute('aria-label', tx('draw.ballDrawn', { team: t.name }));

function setDrawUI() {
  const busy = ceremony.busy;
  const left = teamCount() - ceremony.drawn;
  $('#drawstart').disabled = busy || left === 0;
  $('#drawstart').textContent = busy && ceremony.auto
    ? tx('draw.drawing')
    : (ceremony.drawn ? tx('draw.autoRemaining', { n: left }) : tx('draw.auto'));
  $('#drawpause').hidden = !(busy && ceremony.auto);
  $('#drawskip').hidden = !busy;
  $('#drawskip').textContent = tx(ceremony.auto ? 'draw.skipAll' : 'draw.skipTeam');
  $('#drawreset').hidden = ceremony.drawn === 0 || busy;
  $('#drawbowls').classList.toggle('locked', busy);
}

function activateBowl(pot) {
  document.querySelectorAll('#drawbowls .bowl').forEach(b =>
    b.classList.toggle('active', b.dataset.pot === String(pot)));
}

function stageTeam(t) {
  const stage = $('#drawstage');
  stage.innerHTML = '';
  const card = el('div', 'drawcard');
  card.appendChild(stageBall(t));
  const info = el('div', 'info');
  info.appendChild(el('h3', null, t.name));
  info.appendChild(el('div', 'meta', tx('draw.opponentsOf', { country: t.country, pot: t.pot, n: perTeam() })));
  card.appendChild(info);
  stage.appendChild(card);
  const opps = el('div', 'opps');
  opps.id = 'drawopps';
  stage.appendChild(opps);
}

function revealOpponent(r) {
  const opp = byId[r.opp];
  const row = el('div', 'opp p' + opp.pot);
  row.appendChild(el('i', 'key ' + (r.venue === 'H' ? 'home' : 'away')));
  row.appendChild(el('span', 'nm', opp.name));
  row.appendChild(el('span', 'vn', tx(r.venue === 'H' ? 'venue.home' : 'venue.away')));
  $('#drawopps').appendChild(row);
  requestAnimationFrame(() => row.classList.add('in'));
}

function resetCeremony() {
  ceremony.gen++;
  ceremony.busy = false;
  ceremony.auto = false;
  ceremony.paused = false;
  ceremony.skip = false;
  ceremony.drawn = 0;
  ceremony.pot = 0;
  ceremony.taken = new Set();
  $('#drawpause').textContent = tx('draw.pause');
  renderBowls();
  $('#drawstage').innerHTML = '';
  setDrawUI();
  drawStatus(tx('draw.intro'));
}

function finishCeremony() {
  POTS().forEach(pot => {
    remainingInPot(pot).forEach(id => {
      ceremony.taken.add(id);
      openBall(freeBall(pot), byId[id]);
    });
  });
  activateBowl(0);
  ceremony.drawn = teamCount();
  ceremony.busy = false;
  ceremony.auto = false;
  ceremony.paused = false;
  ceremony.skip = false;
  $('#drawpause').textContent = 'Duraklat';
  setDrawUI();
  drawStatus(tx('draw.finished', { teams: teamCount(), matches: matchCount() }));
}

/** Tek takimin cekilisi: top calkalanir, acilir, rakipler tek tek gelir. */
async function revealTeam(t, gen, ball) {
  ceremony.pot = t.pot;
  ceremony.taken.add(t.id);
  activateBowl(t.pot);
  drawStatus(tx('draw.spinning', { pot: t.pot }));
  if (!await cwait(CTIME.spin, gen)) return false;

  openBall(ball || freeBall(t.pot), t);
  activateBowl(0);
  ceremony.drawn++;
  stageTeam(t);
  drawStatus(tx('draw.opening', { n: ceremony.drawn, total: teamCount(), team: t.name }));
  if (!await cwait(CTIME.reveal, gen)) return false;

  const rows = state.view[t.id];
  for (let i = 0; i < rows.length; i++) {
    revealOpponent(rows[i]);
    if (ceremony.skip) continue;
    if (!await cwait(CTIME.opponent, gen)) return false;
  }
  drawStatus(tx('draw.teamDone', { n: ceremony.drawn, total: teamCount(), team: t.name, h: perTeam() / 2 }));
  return true;
}

/** Tiklanan torbadan kalanlar arasindan rastgele bir takim ceker. */
async function pickBall(ball) {
  if (ceremony.busy || !state.fixtures.length) return;
  const pot = Number(ball.dataset.pot);
  const left = remainingInPot(pot);
  if (!left.length) return;

  const t = byId[left[Math.floor(Math.random() * left.length)]];
  const gen = ceremony.gen;
  ceremony.busy = true;
  ceremony.auto = false;
  ceremony.skip = false;
  setDrawUI();

  const ok = await revealTeam(t, gen, ball);
  if (ceremony.gen !== gen) return;

  ceremony.busy = false;
  ceremony.skip = false;
  if (ok && ceremony.drawn >= teamCount()) { finishCeremony(); return; }
  setDrawUI();
  if (ok) drawStatus(tx('draw.next', { n: ceremony.drawn, total: teamCount() }));
}

async function runCeremony() {
  if (ceremony.busy || !state.fixtures.length) return;
  const gen = ceremony.gen;
  ceremony.busy = true;
  ceremony.auto = true;
  ceremony.paused = false;
  ceremony.skip = false;
  $('#drawpause').textContent = 'Duraklat';
  setDrawUI();

  for (let pot = 1; pot <= FORMAT.pots && !ceremony.skip; pot++) {
    let left = remainingInPot(pot);
    while (left.length && !ceremony.skip) {
      const t = byId[left[Math.floor(Math.random() * left.length)]];
      if (!await revealTeam(t, gen)) return;
      if (!await cwait(CTIME.rest, gen)) return;
      left = remainingInPot(pot);
    }
  }
  if (ceremony.gen !== gen) return;
  finishCeremony();
}

const API = location.hostname.endsWith('workers.dev')
  ? ''
  : 'https://drawlab.cmcygz.workers.dev';
const TOKENS_KEY = 'ucl:tokens';
let savesLoaded = false;

function loadTokens() {
  try { return JSON.parse(localStorage.getItem(TOKENS_KEY)) || {}; }
  catch (e) { return {}; }
}

function storeTokens(t) {
  try { localStorage.setItem(TOKENS_KEY, JSON.stringify(t)); } catch (e) { /* depolama kapali */ }
}

function saveStatus(msg, bad) {
  const p = $('#savestatus');
  p.textContent = msg;
  p.classList.toggle('bad', !!bad);
}

/** O anda ekranda gecerli olan tum skorlar: tahminler ve simulasyon birlikte. */
function currentScores() {
  const scores = {}, picks = [];
  for (const f of state.fixtures) {
    const s = scoreFor(f);
    if (!s) continue;
    const k = fxKey(f);
    scores[k] = [s.hg, s.ag];
    if (s.pick) picks.push(k);
  }
  return { scores, picks };
}

function applySave(payload) {
  const byKey = new Map(state.fixtures.map(f => [fxKey(f), f]));
  const pickSet = new Set(payload.picks || []);
  const picks = {}, sim = new Map();
  for (const k of Object.keys(payload.scores || {})) {
    const f = byKey.get(k);
    if (!f) continue;
    const [hg, ag] = payload.scores[k];
    if (pickSet.has(k)) picks[k] = { hg, ag };
    else sim.set(f, { f, hg, ag });
  }
  state.picks = picks;
  state.simIndex = sim;
  state.results = Array.from(sim.values());
  state.dirty = false;
}

async function apiCall(path, options) {
  const res = await fetch(API + path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

const shareUrl = id => location.origin + location.pathname + '#k=' + id;

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    const old = btn.textContent;
    btn.textContent = tx('share.copied');
    setTimeout(() => { btn.textContent = old; }, 1500);
  } catch (e) {
    prompt(tx('share.fallback'), text);
  }
}

function renderShare(host, id) {
  host.innerHTML = '';
  const box = el('div', 'sharebox');
  box.appendChild(el('div', 'lbl', tx('share.label')));
  const row = el('div', 'row');
  const input = document.createElement('input');
  input.type = 'text';
  input.readOnly = true;
  input.value = shareUrl(id);
  input.addEventListener('focus', () => input.select());
  row.appendChild(input);
  const btn = el('button', null, tx('share.copy'));
  btn.addEventListener('click', () => copyText(input.value, btn));
  row.appendChild(btn);
  box.appendChild(row);
  host.appendChild(box);
}

/** Ekrandaki skorlari sunucuya yazar; id ve sayilari dondurur. */
async function submitSave(name) {
  if (!API) throw new Error(tx('saves.notConfigured'));
  if (!name) throw new Error(tx('saves.needName'));
  const { scores, picks } = currentScores();
  const total = Object.keys(scores).length;
  if (!total) throw new Error(tx('saves.needScores'));

  const data = await apiCall('/api/saves', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, seed: state.seed, scores, picks })
  });
  const tokens = loadTokens();
  tokens[data.id] = data.token;
  storeTokens(tokens);
  savesLoaded = false;
  state.dirty = false;
  return { id: data.id, total, picks: picks.length };
}

async function createSave() {
  const btn = $('#savebtn');
  btn.disabled = true;
  saveStatus(tx('saves.saving'));
  try {
    const r = await submitSave($('#savename').value.trim());
    $('#savename').value = '';
    saveStatus(tx('saves.saved', { total: r.total, picks: r.picks }));
    renderShare($('#saveshare'), r.id);
    listSaves();
  } catch (e) {
    saveStatus(tx('saves.saveFailed', { msg: e.message }), true);
  } finally {
    btn.disabled = false;
  }
}

async function saveFixture() {
  const name = prompt(tx('md.savePrompt'), tx('md.saveDefault', { seed: state.seed }));
  if (name === null) return;
  const btn = $('#savefixture');
  btn.disabled = true;
  mdStatus(tx('saves.saving'));
  try {
    const r = await submitSave(name.trim());
    mdStatus(tx('saves.saved', { total: r.total, picks: r.picks }));
    renderShare($('#mdshare'), r.id);
  } catch (e) {
    mdStatus(tx('saves.saveFailed', { msg: e.message }), true);
  } finally {
    btn.disabled = false;
  }
}

async function listSaves() {
  const host = $('#saves');
  host.innerHTML = '';
  if (!API) {
    host.appendChild(el('p', 'hint', tx('saves.notConfigured')));
    return;
  }
  host.appendChild(el('p', 'hint', tx('saves.loading')));

    savesLoaded = true;
    renderSaves(data.saves || []);
  } catch (e) {
    host.innerHTML = '';
    host.appendChild(el('p', 'hint bad', tx('saves.listFailed', { msg: e.message })));

function renderSaves(rows) {
  const host = $('#saves');
  host.innerHTML = '';
  if (!rows.length) {
    host.appendChild(el('p', 'hint', tx('saves.empty')));
    return;
  }
  const tokens = loadTokens();
  const list = el('div', 'savelist');
  rows.forEach(r => {
    const mine = !!tokens[r.id];
    const row = el('div', 'saverow' + (mine ? ' mine' : ''));
    const left = el('div');
    left.appendChild(el('h4', null, r.name));
    const when = new Date(r.created_at).toLocaleDateString(tx('locale'));
    left.appendChild(el('div', 'meta',
      tx('saves.meta', { seed: r.seed, matches: r.matches, picks: r.picks, date: when })));
    row.appendChild(left);

    const acts = el('div', 'acts');
    const open = el('button', null, tx('saves.open'));
    open.dataset.open = r.id;
    acts.appendChild(open);
    const link = el('button', 'ghost', tx('saves.link'));
    link.dataset.link = r.id;
    acts.appendChild(link);

      del.dataset.del = r.id;
      acts.appendChild(del);

    list.appendChild(row);
  });

}

async function openSave(id, fromLink) {
  if (!fromLink && !confirmDiscard()) return;
  saveStatus(tx('saves.opening'));
  if (fromLink) mdStatus(tx('saves.openingShared'));
  try {
    const data = await apiCall('/api/saves/' + encodeURIComponent(id));
    const payload = data.payload || {};
    $('#seed').value = payload.seed;
    newDraw(payload.seed, () => {
      applySave(payload);
      writeHash('k=' + id);
    });
    const note = tx('saves.opened', { name: data.name, seed: payload.seed, matches: data.matches });
    saveStatus(note);
    if (fromLink) { mdStatus(note); showTab('table'); }
  } catch (e) {
    saveStatus(tx('saves.openFailed', { msg: e.message }), true);
    if (fromLink) mdStatus(tx('saves.openFailedShared', { msg: e.message }), true);
  }
}

async function removeSave(id) {
  const tokens = loadTokens();
  if (!tokens[id]) return saveStatus(tx('saves.notYours'), true);
  if (!confirm(tx('saves.deleteConfirm'))) return;
  try {
    await apiCall('/api/saves/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { 'X-Save-Token': tokens[id] }
    });
    delete tokens[id];
    storeTokens(tokens);
    saveStatus(tx('saves.deleted'));
    listSaves();
  } catch (e) {
    saveStatus(tx('saves.deleteFailed', { msg: e.message }), true);
  }
}

// ---------------------------------------------------------------------------
function renderAll() {
  renderHeader(); renderLegend(); renderMatrix(); renderDetail(); renderTeams(); renderMatchdays(); renderTable();
  resetCeremony();
  $('#probs').innerHTML = '';
  $('#probs').appendChild(el('p', 'hint', tx('probs.press')));
}

document.querySelectorAll('nav.tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(x =>
      x.setAttribute('aria-selected', String(x === b)));
    document.querySelectorAll('main section').forEach(s =>
      (s.hidden = s.id !== 'view-' + b.dataset.view));
    if (b.dataset.view === 'saves' && !savesLoaded) listSaves();
  });
});
$('#redraw').addEventListener('click', redrawFromInput);
$('#random').addEventListener('click', () => {
  if (!confirmDiscard()) return;
  const s = 1 + ((Math.random() * 999999) | 0);
  $('#seed').value = s; newDraw(s);
});
$('#play').addEventListener('click', playSeason);
$('#mcrun').addEventListener('click', runMonteCarlo);
$('#teampick').addEventListener('change', e => selectTeam(e.target.value || null));
$('#teamall').addEventListener('click', () => selectTeam(null));
$('#pickclear').addEventListener('click', clearPicks);
$('#autofill').addEventListener('click', autofillPicks);
$('#drawstart').addEventListener('click', runCeremony);
$('#drawreset').addEventListener('click', resetCeremony);
$('#drawskip').addEventListener('click', () => { ceremony.skip = true; });
$('#drawbowls').addEventListener('click', e => {
  const ball = e.target.closest('button.ball');
  if (ball && !ball.classList.contains('picked')) pickBall(ball);
});
$('#drawpause').addEventListener('click', () => {
  ceremony.paused = !ceremony.paused;
  $('#drawpause').textContent = tx(ceremony.paused ? 'draw.resume' : 'draw.pause');
  activateBowl(ceremony.paused ? 0 : ceremony.pot);
});
$('#drawspeed').addEventListener('change', e => {
  ceremony.speed = Number(e.target.value) || 1;
});
$('#savefixture').addEventListener('click', saveFixture);
$('#matchdays').addEventListener('input', e => {
  const inp = e.target.closest('input[data-fx]');
  if (inp) onPickInput(inp);
});
$('#savebtn').addEventListener('click', createSave);
$('#savereload').addEventListener('click', listSaves);
$('#saves').addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) return openSave(open.dataset.open);
  const link = e.target.closest('[data-link]');
  if (link) return copyText(shareUrl(link.dataset.link), link);
  const del = e.target.closest('[data-del]');
  if (del) removeSave(del.dataset.del);
});
window.addEventListener('hashchange', () => {
  const h = parseHash();
  if (h.saveId) return openSave(h.saveId, true);
  if (h.seed && h.seed !== state.seed && confirmDiscard()) {
    $('#seed').value = h.seed;
    newDraw(h.seed);
  }
});

$('#lang').addEventListener('change', e => setLang(e.target.value));

/**
 * Dili degistirir ve ekrandaki her seyi yeniden cizer. Kura, tahminler ve skorlar
 * korunur; yalnizca metinler degisir.
 */
function setLang(lang) {
  LANG = I18N[lang] ? lang : 'en';
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) { /* depolama kapalı */ }
  $('#lang').value = LANG;
  applyStaticI18n();
  fillCompPicker();
  renderHeader();
  renderLegend();
  setStatus(state.status.key, state.status.vars);
  if (!COMP.available || !TEAMS.length) { renderUnavailable(); return; }
  fillTeamPicker();
  renderMatrix(); renderDetail(); renderTeams(); renderMatchdays(); renderTable();
  relabelCeremony();
  mdStatus('');
  saveStatus('');
  $('#probs').innerHTML = '';
  $('#probs').appendChild(el('p', 'hint', tx('probs.press')));
  if (savesLoaded) listSaves();
}

/** Torba basliklarini yeniden yazar; devam eden cekilisi bozmaz. */
function relabelCeremony() {
  document.querySelectorAll('#drawbowls .bowl').forEach(bowl => {
    const h = bowl.querySelector('h4');
    if (h) h.textContent = tx('pot', { n: bowl.dataset.pot });
    bowl.querySelectorAll('.ball:not(.picked)').forEach(b => {
      b.title = tx('draw.ballTitle', { n: bowl.dataset.pot });
      b.setAttribute('aria-label', tx('draw.ballLabel', { n: bowl.dataset.pot }));
    });
  });
  setDrawUI();
  if (!ceremony.busy && ceremony.drawn === 0) drawStatus(tx('draw.intro'));
  else if (!ceremony.busy && ceremony.drawn >= teamCount()) drawStatus(tx('draw.finished', { teams: teamCount(), matches: matchCount() }));
}

$('#comp').addEventListener('change', e => switchCompetition(e.target.value));

LANG = detectLang();
$('#lang').value = LANG;
applyStaticI18n();

const initialHash = parseHash();
useCompetition(initialHash.comp || 'ucl');
fillCompPicker();
state.seed = initialHash.seed || state.seed;
$('#seed').value = state.seed;
if (!COMP.available || !TEAMS.length) {
  renderUnavailable();
} else {
  fillTeamPicker();
  newDraw(state.seed);
}
if (initialHash.saveId) openSave(initialHash.saveId, true);

</script>
</body>
</html>
