# main'e her gonderimde Worker'i yayina alir. Elle tetiklemek icin
# GitHub > Actions > Deploy > Run workflow.
#
# Gereken depo secret'i: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit yetkili).
# Hesapta birden fazla Cloudflare hesabi varsa CLOUDFLARE_ACCOUNT_ID de eklenir.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Parcalardan index.html ve api/src/site.js yeniden uretilir, boylece
      # yayina giden HTML her zaman kaynakla ayni olur.
      - name: Siteyi derle
        run: python3 build.py

      - name: Worker'i yayina al
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler CF_ACCOUNT_ID'yi eski bir takma ad olarak kendisi okuyor,
          # o yuzden aktarim degiskenine onun tanimadigi bir ad veriliyor.
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Panelden kopyalanan token'a kacan bosluk/satir sonu Authorization
          # basligini bozuyor; temizlenmezse kimlik dogrulama hatasi veriyor.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret'i tanimli degil." >&2
            exit 1
          fi
          # Token'in kendisi loglanmaz; yalnizca bicimi bildirilir. Cloudflare
          # panelinde token degeri ile token ID'si yan yana duruyor ve yanlis
          # olani kopyalamak "Authentication failed [code: 9106]" veriyor.
          case "$CLOUDFLARE_API_TOKEN" in
            *[!0-9a-f]*)
              echo "Token bicimi: API token'a benziyor (${#CLOUDFLARE_API_TOKEN} karakter)." ;;
            *)
              echo "::warning::Token tamamen kucuk harf hex ve ${#CLOUDFLARE_API_TOKEN} karakter."
              echo "::warning::Bu bir API token degeri degil; 32 karakterse token ID'si, 37 karakterse Global API Key'dir." ;;
          esac
          if [ -n "$ACCOUNT_ID_SECRET" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID_SECRET"
          fi
          unset ACCOUNT_ID_SECRET
          npx --yes wrangler@3 deploy
