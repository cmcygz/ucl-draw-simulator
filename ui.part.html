<style>
:root{
  --paper:#E4EAEE; --paper-2:#F1F5F7; --paper-3:#D6DFE5;
  --ink:#0C1A26; --ink-2:#41586A; --ink-3:#7E93A2;
  --rule:#B9C7D0;
  --p1:#23256E; --p2:#0B6E6B; --p3:#B26A00; --p4:#8B2A63;
  --mark:#FFE14D;
  --cell:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}

/* ---------- header ---------- */
.eyebrow{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-2); display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.eyebrow b{font-weight:600;color:var(--ink)}
h1{
  font-family:'Big Shoulders Display','Inter Tight',sans-serif;
  font-weight:800; font-size:clamp(46px,9vw,104px); line-height:.86;
  margin:10px 0 0; letter-spacing:-.01em; text-transform:uppercase;
}
h1 span{display:block;color:var(--ink-3)}
.lede{max-width:52ch;margin:16px 0 0;color:var(--ink-2)}
.rule{height:2px;background:var(--ink);margin:22px 0 0}
.rule.thin{height:1px;background:var(--rule)}

/* ---------- controls ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 0}
button,.seedbox{
  font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px;
  letter-spacing:.06em; text-transform:uppercase;
  background:var(--paper-2); color:var(--ink);
  border:1.5px solid var(--ink); border-radius:0; padding:9px 14px; cursor:pointer;
  transition:background .12s,color .12s,transform .06s;
}
button:hover{background:var(--ink);color:var(--paper-2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:progress}
button.ghost{border-color:var(--rule);color:var(--ink-2)}
button.ghost:hover{border-color:var(--ink);background:var(--ink);color:var(--paper-2)}
.seedbox{display:flex;align-items:center;gap:8px;cursor:default;background:transparent;border-style:dashed}
.seedbox input{
  font:inherit;width:8ch;border:0;background:transparent;color:var(--ink);
  text-align:center;outline:none;border-bottom:1.5px solid var(--ink)
}
select{
  font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px;
  border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:0
}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:0;margin:26px 0 0;border-bottom:2px solid var(--ink);flex-wrap:wrap}
nav.tabs button{
  border:0;border-bottom:4px solid transparent;background:transparent;
  padding:10px 16px 8px;margin-bottom:-2px;color:var(--ink-2)
}
nav.tabs button:hover{background:transparent;color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
section[hidden]{display:none}
section{margin-top:26px}

/* ---------- matrix ---------- */
.matrixScroll{overflow-x:auto;padding-bottom:8px}
table.matrix{border-collapse:collapse;font-family:'IBM Plex Mono',monospace}
table.matrix th.corner{width:150px}
table.matrix th.col{
  height:56px;padding:0 0 6px;vertical-align:bottom;font-weight:500;font-size:10.5px;
  letter-spacing:.08em;color:var(--ink-2)
}
table.matrix th.col div{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto}
table.matrix th.row{
  text-align:right;padding-right:10px;font-weight:500;font-size:11.5px;white-space:nowrap;
  border-right:2px solid var(--ink);cursor:pointer
}
table.matrix th.row em{font-style:normal;color:var(--ink-3);font-size:10px;margin-left:6px}
td.c{
  width:var(--cell);height:var(--cell);border:1px solid var(--paper-3);
  padding:0;position:relative
}
td.c i{display:block;width:100%;height:100%}
td.c.home i{background:currentColor}
td.c.away i{box-shadow:inset 0 0 0 2.5px currentColor}
td.c.self{background:repeating-linear-gradient(45deg,var(--paper-3) 0 2px,transparent 2px 4px)}
td.c.p1,th.p1{color:var(--p1)} td.c.p2,th.p2{color:var(--p2)}
td.c.p3,th.p3{color:var(--p3)} td.c.p4,th.p4{color:var(--p4)}
td.c.lit{background:var(--mark)}
tr.sel th.row{background:var(--ink);color:var(--paper);border-right-color:var(--ink)}
tr.sel th.row em{color:var(--paper-3)}
.potrail{width:6px;padding:0}
.potrail.p1{background:var(--p1)} .potrail.p2{background:var(--p2)}
.potrail.p3{background:var(--p3)} .potrail.p4{background:var(--p4)}

.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
.key{width:14px;height:14px;display:inline-block}
.key.home{background:var(--ink)} .key.away{box-shadow:inset 0 0 0 2.5px var(--ink)}

/* ---------- team detail ---------- */
.detail{margin-top:24px;border-top:2px solid var(--ink);padding-top:16px}
.detail h3{
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;
  font-size:34px;text-transform:uppercase;margin:0;line-height:1
}
.detail .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
ol.fix{list-style:none;margin:14px 0 0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 22px}
ol.fix li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:12.5px}
ol.fix .md{color:var(--ink-3);width:34px;flex:none}
ol.fix .vs{width:16px;flex:none;font-weight:600}
ol.fix .vs.h{color:var(--ink)} ol.fix .vs.a{color:var(--ink-3)}
ol.fix .nm{flex:1;font-family:'Inter Tight',sans-serif;font-size:13.5px}
ol.fix .pt{font-size:10px;color:var(--ink-3)}
.hint{color:var(--ink-3);font-family:'IBM Plex Mono',monospace;font-size:11.5px}

/* ---------- team grid ---------- */
.pothead{display:flex;align-items:baseline;gap:12px;margin:28px 0 10px}
.pothead h2{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;
  text-transform:uppercase;margin:0;letter-spacing:.02em}
.pothead .line{flex:1;height:2px;background:var(--rule)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{
  display:block;width:100%;text-align:left;font:inherit;letter-spacing:normal;
  text-transform:none;color:var(--ink);cursor:pointer;
  background:var(--paper-2);border:1px solid var(--rule);border-left-width:5px;padding:12px 14px;
  transition:background .12s,border-color .12s,transform .06s;
}
.card:hover{
  background:var(--paper-2);color:var(--ink);
  border-top-color:var(--ink);border-right-color:var(--ink);border-bottom-color:var(--ink)
}
.card:hover h4{text-decoration:underline;text-underline-offset:3px}
.card:active{transform:translateY(1px)}
.card.p1{border-left-color:var(--p1)} .card.p2{border-left-color:var(--p2)}
.card.p3{border-left-color:var(--p3)} .card.p4{border-left-color:var(--p4)}

/* ---------- tek takim odagi ---------- */
.focushead{display:flex;align-items:baseline;gap:14px;margin:2px 0 8px}
.focushead h2{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
  font-size:clamp(34px,6vw,52px);text-transform:uppercase;margin:0;line-height:.9}
.focushead .line{flex:1;height:3px;background:var(--ink)}
.focus.p1 .focushead .line{background:var(--p1)} .focus.p2 .focushead .line{background:var(--p2)}
.focus.p3 .focushead .line{background:var(--p3)} .focus.p4 .focushead .line{background:var(--p4)}
.focus .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2)}
.fixscroll{overflow-x:auto;margin-top:18px}
table.fixtab{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
table.fixtab th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);padding:0 10px 6px;
  border-bottom:2px solid var(--ink);white-space:nowrap}
table.fixtab td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.fixtab td.md{color:var(--ink-3)}
table.fixtab td.dt{color:var(--ink-3);font-size:11px}
table.fixtab td.nm{font-family:'Inter Tight',sans-serif;font-size:14.5px;font-weight:600;white-space:normal}
table.fixtab td.cn,table.fixtab td.pt{color:var(--ink-3);font-size:11px}
table.fixtab td.vn.p1{color:var(--p1)} table.fixtab td.vn.p2{color:var(--p2)}
table.fixtab td.vn.p3{color:var(--p3)} table.fixtab td.vn.p4{color:var(--p4)}
table.fixtab td.vn .key{width:11px;height:11px;vertical-align:-1px}
table.fixtab .key.home{background:currentColor}
table.fixtab .key.away{background:transparent;box-shadow:inset 0 0 0 2.5px currentColor}
table.fixtab td.vn .vt{color:var(--ink-2);font-size:11px;margin-left:8px}
table.fixtab td.sc{font-weight:600}
table.fixtab td.sc.w{color:var(--p2)} table.fixtab td.sc.d{color:var(--ink-2)}
table.fixtab td.sc.l{color:var(--p4)}
.card h4{margin:0;font-size:15px;font-weight:650}
.card .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.card ul{list-style:none;margin:0;padding:0}
.card li{display:flex;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:2.5px 0}
.card li .md{color:var(--ink-3);width:28px}
.card li .vs{width:14px;font-weight:600}
.card li .nm{font-family:'Inter Tight',sans-serif;font-size:12.5px}

/* ---------- matchdays ---------- */
.mdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.mdblock h4{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:22px;
  text-transform:uppercase;margin:0 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.mdblock .m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  padding:4px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.mdblock .m .a{text-align:right}
.mdblock .m .s{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);
  background:var(--paper-3);padding:1px 6px;white-space:nowrap}

/* ---------- table ---------- */
table.std{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
table.std th{text-align:right;font-weight:500;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);padding:0 6px 6px;border-bottom:2px solid var(--ink)}
table.std th.l,table.std td.l{text-align:left}
table.std td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:right}
table.std td.nm{font-family:'Inter Tight',sans-serif;font-size:13.5px;text-align:left}
table.std tr.q td{background:rgba(35,37,110,.09)}
table.std tr.po td{background:rgba(178,106,0,.09)}
table.std td.pos{color:var(--ink-3)}
table.std td.pts{font-weight:600}
.bands{display:flex;gap:20px;margin-top:12px;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--ink-2);flex-wrap:wrap}
.swatch{width:12px;height:12px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- probabilities ---------- */
.prob{display:grid;grid-template-columns:150px 1fr 62px;gap:10px;align-items:center;
  padding:3px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.prob .nm{font-family:'Inter Tight',sans-serif;font-size:13px;text-align:right}
.pbar{display:flex;height:15px;background:var(--paper-3)}
.pbar i{display:block;height:100%}
.pbar .q{background:var(--p1)} .pbar .p{background:var(--p3)}
.progress{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}

footer{margin-top:56px;border-top:1px solid var(--rule);padding-top:16px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);line-height:1.7}

@media (max-width:640px){
  :root{--cell:16px}
  .wrap{padding:20px 14px 56px}
  table.matrix th.corner{width:104px}
  table.matrix th.row{font-size:10px}
  ol.fix{grid-template-columns:1fr}
  .prob{grid-template-columns:104px 1fr 54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
